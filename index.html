<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHA SME Sales Dashboard</title><style>
:root{--bg:#f6f8fb;--card:#fff;--text:#14213d;--muted:#64748b;--line:#e5e7eb;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:24px}.sub{font-size:13px;color:var(--muted);margin-top:4px}.controls,.filters{display:flex;gap:8px;flex-wrap:wrap}select,input,button{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}button{cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.callout,.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.callout{margin-top:14px;border-left:4px solid var(--blue);background:#eff6ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase}.kpi .v{font-size:28px;font-weight:700;margin-top:4px}h2{font-size:16px;margin:0 0 10px}.barrow{display:grid;grid-template-columns:160px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.bar{height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#eef2ff}.hot{background:#fee2e2;color:#991b1b}.warm{background:#fef3c7;color:#92400e}.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:#fff}.section{margin-top:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="header"><div><h1>WHA SME Sales Command Center</h1><div class="sub">Rajendra + ChatGPT • Free GitHub dashboard</div></div><div class="controls"><select id="preset"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7">Last 7 Days</option><option value="month">This Month</option><option value="custom">Custom</option></select><input id="from" type="date"><input id="to" type="date"><button class="primary" onclick="render()">Apply</button></div></div><div id="summary" class="callout"></div><div id="kpis" class="grid"></div><div class="two"><div class="card"><h2>Call Today</h2><div id="calls"></div></div><div class="card"><h2>Funnel</h2><div id="funnel"></div></div></div><div class="two"><div class="card"><h2>Segment Performance</h2><div id="segments"></div></div><div class="card"><h2>Offer Performance</h2><div id="offers"></div></div></div><div class="card section"><h2>Activity</h2><div class="filters"><select id="sf"><option value="">All segments</option><option>MIDC / Industrial</option><option>Healthcare</option><option>Builder / Developer</option></select><select id="of"><option value="">All offers</option><option>Website</option><option>Performance Marketing</option><option>SEO / AI SEO</option><option>Branding</option></select><select id="stf"><option value="">All statuses</option><option>Ready for Outreach</option><option>Contacted</option><option>Replied</option><option>Meeting</option></select><input id="q" placeholder="Search company/contact"><button onclick="renderTable()">Filter</button></div><div style="max-height:480px;overflow:auto;margin-top:10px"><table><thead><tr><th>Date</th><th>Company</th><th>Segment</th><th>Offer</th><th>Contact</th><th>Status</th><th>Reply</th><th>Next Action</th></tr></thead><tbody id="activity"></tbody></table></div></div></div>
<script>
const TODAY='2026-10-07';
const DATA=[
{date:'2026-10-07',company:'Thermosonics',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Rohan / Team',title:'Management / Sales',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Ajay Engineering Works',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Team',title:'Management / Sales',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Macseal Engineering Industries',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Sales Team',title:'Sales',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Malkar Industries',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Samir / Team',title:'Management / Sales',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Associated Smelters',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Mr. Tipnis',title:'Management',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Navdurga Metals',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Sanjay',title:'Management',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'VytalYou',segment:'Healthcare',offer:'Performance Marketing',contact:'Team',title:'Marketing / Management',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Gami Group / Gami Mirava',segment:'Builder / Developer',offer:'Performance Marketing',contact:'Team',title:'Marketing',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Prasol Chemicals',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Team',title:'Marketing / Management',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Naveen Shukla - Powai B2B requirement',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Naveen Shukla',title:'Buyer / Decision-maker',status:'Contacted',reply:'—',temp:'Hot',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Straterise - Mumbai requirement',segment:'Builder / Developer',offer:'Website',contact:'Team',title:'Buyer / Decision-maker',status:'Contacted',reply:'—',temp:'Hot',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-07',company:'Bizgull - Mumbai requirement',segment:'Builder / Developer',offer:'Performance Marketing',contact:'Team',title:'Buyer / Decision-maker',status:'Contacted',reply:'—',temp:'Hot',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-06',company:'Symatic Engineering Pvt. Ltd.',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Asha Prasad',title:'Director',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'},
{date:'2026-10-06',company:'Natvar Iron & Steel Works',segment:'MIDC / Industrial',offer:'SEO / AI SEO',contact:'Chetan Shah',title:'Director',status:'Contacted',reply:'—',temp:'Warm',researched:1,qualified:1,emails:1,followups:0,replies:0,positive:0,meetings:0,next:'Follow up'}
];
let current=[];const el=id=>document.getElementById(id),d=s=>new Date(s+'T00:00:00'),pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
function preset(){let p=el('preset').value,t=d(TODAY),f=new Date(t);if(p==='yesterday'){f.setDate(f.getDate()-1);t=new Date(f)}else if(p==='7'){f.setDate(f.getDate()-6)}else if(p==='month'){f=new Date(t.getFullYear(),t.getMonth(),1)}else if(p==='custom')return;el('from').value=f.toISOString().slice(0,10);el('to').value=t.toISOString().slice(0,10);render()}el('preset').addEventListener('change',preset);el('from').value=TODAY;el('to').value=TODAY;
function agg(a,k){return a.reduce((m,x)=>(m[x[k]]=(m[x[k]]||0)+1,m),{})}function breakdown(id,key){const m=agg(current,key),mx=Math.max(...Object.values(m),1);el(id).innerHTML=Object.entries(m).map(([k,v])=>'<div class="barrow"><span>'+k+'</span><div class="bar"><span style="width:'+(v/mx*100)+'%"></span></div><b>'+v+'</b></div>').join('')||'<div class="small">No data.</div>'}
function render(){const f=d(el('from').value),t=d(el('to').value);current=DATA.filter(x=>{let z=d(x.date);return z>=f&&z<=t});let s=k=>current.reduce((a,x)=>a+(x[k]||0),0);let ms=[['Prospects Researched',s('researched')],['Qualified',s('qualified')],['Emails Sent',s('emails')],['Follow-ups',s('followups')],['Replies',s('replies')],['Positive Replies',s('positive')],['Meetings',s('meetings')],['Reply Rate',pct(s('replies'),s('emails'))]];el('kpis').innerHTML=ms.map(m=>'<div class="card kpi"><div class="l">'+m[0]+'</div><div class="v">'+m[1]+'</div></div>').join('');let hot=current.filter(x=>x.next==='Call today');el('summary').innerHTML='<b>'+s('researched')+' researched</b>, '+s('qualified')+' qualified, '+s('emails')+' emails, '+s('replies')+' replies, '+s('meetings')+' meetings. <b>'+hot.length+' need a call.</b>';el('calls').innerHTML=hot.map(x=>'<div style="padding:9px 0;border-bottom:1px solid #eee"><b>'+x.company+'</b><br><span class="small">'+x.contact+' • '+x.offer+'</span><br><span class="badge hot">'+x.reply+'</span></div>').join('')||'<div class="small">No hot prospects in this period.</div>';let fz=[['Researched',s('researched')],['Qualified',s('qualified')],['Contacted',current.filter(x=>['Contacted','Replied','Meeting'].includes(x.status)).length],['Replied',s('replies')],['Meeting',s('meetings')]],mx=Math.max(...fz.map(x=>x[1]),1);el('funnel').innerHTML=fz.map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="bar"><span style="width:'+(x[1]/mx*100)+'%"></span></div><b>'+x[1]+'</b></div>').join('');breakdown('segments','segment');breakdown('offers','offer');renderTable()}
function renderTable(){let sf=el('sf').value,of=el('of').value,st=el('stf').value,q=el('q').value.toLowerCase();let a=current.filter(x=>(!sf||x.segment===sf)&&(!of||x.offer===of)&&(!st||x.status===st)&&(!q||(x.company+x.contact).toLowerCase().includes(q)));el('activity').innerHTML=a.map(x=>'<tr><td>'+x.date+'</td><td><b>'+x.company+'</b></td><td>'+x.segment+'</td><td>'+x.offer+'</td><td>'+x.contact+'<br><span class="small">'+x.title+'</span></td><td><span class="badge '+x.temp.toLowerCase()+'">'+x.status+'</span></td><td>'+x.reply+'</td><td>'+x.next+'</td></tr>').join('')||'<tr><td colspan="8" class="small">No matching activity.</td></tr>'}render();
</script></body></html>
